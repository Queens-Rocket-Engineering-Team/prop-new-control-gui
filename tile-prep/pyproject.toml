[project]
name = "tile-prep"
version = "0.2.0"
# Tile downloading now lives in the app itself (Flight panel → Download Maps,
# backed by src-tauri/src/map_download.rs), so the bbox picker / fetcher /
# preview scripts this project started as are gone. What remains is the
# dev-only mock GPS server used to drive the flight panel without hardware.
description = "Dev tooling for the QRET launch control GUI: mock GPS telemetry replay."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# mock_gps_server.py only (dev-time flight replay for the GUI)
dev = ["websockets>=13"]

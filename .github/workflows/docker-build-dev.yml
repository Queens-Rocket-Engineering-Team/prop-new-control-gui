name: Docker Build (Dev)

# Publishes the view-only web image on every push, so the container can be
# tested on a server without cutting a release.
#
# Desktop installers are deliberately not built here: there is no release to
# attach them to, and three platforms of Rust compilation would make every push
# slow for no benefit. Release.yml builds those.

on: push

jobs:
    web:
        name: View-only web image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # Required for pushing to GHCR

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # Three tags, for three uses:
            #   dev      — moving; what a server pins while iterating
            #   <branch> — moving; lets two branches be tested side by side
            #   <sha>    — immutable; pin this when reproducing a specific result
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-web
                  tags: |
                      type=raw,value=dev
                      type=ref,event=branch
                      type=raw,value=${{ github.sha }}

            - name: Build and push image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./Dockerfile.web
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./src/main.css">
    <meta charset="UTF-8" />
    <title>Flight panel harness</title>
    <!-- Copies of App.vue's scoped layout rules (scoped styles don't apply here) -->
    <style>
      .container { margin: 0; display: flex; flex-direction: column; height: 100vh; }
      #grid-container { display: grid; gap: 0; flex: 1; min-height: 0; }
      .swap-container {
        background-color: var(--bg-primary);
        border: var(--border-color) 2px solid;
        border-radius: 0 10px 10px 0;
        padding: 10px;
        text-align: left;
      }
      .harness-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: #222;
        color: #ddd;
        font-family: sans-serif;
        font-size: 0.85rem;
      }
      .harness-controls button { padding: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/flight_harness.js"></script>
  </body>
</html>

# Static host for the view-only GUI.
#
# Port 8080 rather than 80: this container runs with host networking alongside
# the server stack, which already holds 8000 (API), 8189/8558/8889/9997
# (mediamtx) and 64738 (mumble).
#
# Nothing is proxied. The browser talks to the API and to mediamtx directly,
# exactly as the desktop app does — the GUI container only ships the bundle.

server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Written at container start from the environment; must never be cached, or
    # a redeploy pointing at a different server would be ignored by open tabs.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths render the app rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

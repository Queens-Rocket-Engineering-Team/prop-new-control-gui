[package]
name = "HELM"
version = "0.1.0"
description = "Hub for Engine Launch & Monitoring"
authors = ["QRET"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prop_control_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "time", "net", "sync", "fs", "io-util"] }
# Offline map tiles: reads per-launch-site MBTiles (sqlite) for the flight
# panel. `bundled` compiles SQLite from source so Linux build hosts don't
# need a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# `stream` for the session-zip download; `rustls-tls` for the in-app satellite
# tile downloader (map_download.rs), which avoids an OpenSSL requirement on
# Linux build hosts. 0.12 matches the version already locked transitively by tauri.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
# RFC3339 timestamps for the map site manifest's fetched_at field.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Match the WebKitGTK binding used by Tauri/Wry. Keep it Linux-only so the
# native WebKit media configuration below cannot affect Windows or macOS.
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }

[dev-dependencies]
tempfile = "3"
